extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@external", "@shareable"])

scalar DateTime

type Mutation {
  startSession: StartSessionResult!
  newSession:   StartSessionResult!
  sendMessage(sessionId: ID!, message: String!): SendMessageAck!
  submitFollowUp(sessionId: ID!, outcome: FollowUpOutcome!, doctorDiagnosis: String): DiagnosisSession!
}

union StartSessionResult = DiagnosisSession | ProfileIncompleteError

type ProfileIncompleteError {
  message: String!
  missingFields: [String!]!
}

type Query {
  activeSession: DiagnosisSession
  session(id: ID!): DiagnosisSession
  sessionHistory(limit: Int, offset: Int): [DiagnosisSession!]!
}

type Subscription {
  sessionUpdated(sessionId: ID!): SessionEvent!
}

type SessionEvent {
  sessionId:      ID!
  type:           SessionEventType!
  message:        String
  stage:          Int!
  status:         SessionStatus!
  requiresAction: ActionType!
  output:         DiagnosisOutput
}

enum SessionEventType {
  MESSAGE
  STAGE_CHANGE
  COMPLETED
  ESCALATED
}

enum SessionStatus {
  IN_PROGRESS
  COMPLETED
  ESCALATED
  ABANDONED
}

enum ActionType {
  COMPLETE_PROFILE
  NONE
  EMERGENCY
  ANALYSIS_PENDING
}

enum FollowUpOutcome {
  IMPROVED
  SAME
  WORSENED
  SAW_DOCTOR
}

enum Severity {
  LOW
  MODERATE
  HIGH
  EMERGENCY
}

enum SessionAction {
  SELF_CARE
  MONITOR
  VISIT_DOCTOR
  ER_NOW
}

type ProbableCause {
  condition: String!
  confidence: Float!
  explanation: String!
}

type RuledOut {
  condition: String!
  reason: String!
}

type Remedy {
  nameEn: String!
  nameHi: String!
  preparationEn: String!
  preparationHi: String!
  ingredients: [String!]!
  source: String!
}

type LabTestRecommendation {
  testName: String!
  slug: String!
  reason: String!
  urgency: String!
}

type DiagnosisOutput {
  severity: Severity!
  probableCauses: [ProbableCause!]!
  ruledOut: [RuledOut!]!
  action: SessionAction!
  actionDetail: String!
  homeRemedies: [Remedy!]!
  labTestsRecommended: [LabTestRecommendation!]!
  watchFor: [String!]!
  disclaimer: String!
  emergencyNumber: String
  language: String!
}

type SessionMessage {
  role:      String!
  content:   String!
  timestamp: String!
}

type DiagnosisSession {
  id: ID!
  userId: ID!
  title: String
  status: SessionStatus!
  stage: Int!
  output: DiagnosisOutput
  messages: [SessionMessage!]!
  questionCount: Int!
  redFlagTriggered: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type MessageResponse {
  message: String!
  stage: Int!
  status: SessionStatus!
  requiresAction: ActionType
}

type SendMessageAck {
  accepted:  Boolean!
  sessionId: ID!
}
